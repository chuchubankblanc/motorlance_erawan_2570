<!doctype html><html lang="th"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Sao Chingcha";src:url("SaoChingcha-Bold.otf");font-weight:700}
@font-face{font-family:"Sao Chingcha";src:url("SaoChingcha-Regular.otf");font-weight:400}
html,body{margin:0}
.card{position:relative;width:1200px;height:630px;overflow:hidden;color:#fff;font-family:"Sao Chingcha",sans-serif;
 background:radial-gradient(2px 2px at 10% 18%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 28% 9%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 44% 26%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 60% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 70% 34%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 20% 40%,#fff 50%,transparent 51%),
 linear-gradient(165deg,#1b1f4b 0%,#45307f 58%,#0e7490 100%)}
.moon{position:absolute;right:46px;top:34px;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff6d6,#ffd36b 70%);box-shadow:0 0 0 30px rgba(255,211,107,.14),0 0 120px 30px rgba(255,211,107,.45)}
.in{position:absolute;left:70px;top:80px;right:70px;display:flex;flex-direction:column;gap:14px}
.eb{font-size:30px;opacity:.85;font-weight:400}
h1{margin:0;font-size:70px;white-space:nowrap;line-height:1.12;font-weight:700}
h1 em{font-style:normal;color:#ffd36b}
.chips{max-width:860px;display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.c{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 20px 7px 8px;font-size:28px}
.c b{min-width:46px;height:46px;border-radius:23px;display:grid;place-items:center;font-size:28px}
.waves{position:absolute;left:0;bottom:0;width:1200px;height:70px;opacity:.55}
.kt{position:absolute;right:170px;bottom:26px;width:130px}
</style></head><body><div class="card">
<div class="moon"></div>
<svg class="waves" viewBox="0 0 400 26" preserveAspectRatio="none"><path d="M0 14 Q25 4 50 14 T100 14 T150 14 T200 14 T250 14 T300 14 T350 14 T400 14 V26 H0Z" fill="#7dd3fc"/><path d="M0 19 Q25 11 50 19 T100 19 T150 19 T200 19 T250 19 T300 19 T350 19 T400 19 V26 H0Z" fill="#38bdf8" opacity=".7"/></svg>
<svg class="kt" viewBox="0 0 58 44"><path d="M29 4v14" stroke="#ffd36b" stroke-width="2"/><ellipse cx="29" cy="4" rx="2.5" ry="3.5" fill="#ffb703"/><path d="M14 30 Q20 12 29 18 Q38 12 44 30Z" fill="#f472b6"/><path d="M20 30 Q24 18 29 22 Q34 18 38 30Z" fill="#fbcfe8"/><path d="M6 30 h46 l-5 8 H11Z" fill="#22c55e"/><path d="M6 30 h46" stroke="#15803d" stroke-width="2"/></svg>
<div class="in">
 <div class="eb">ศูนย์เอราวัณ สำนักการแพทย์ กรุงเทพมหานคร · 24 พ.ย. 2569</div>
 <h1>การปฏิบัติการการแพทย์ฉุกเฉิน<br>ของ กทม. ในวัน<em>ลอยกระทง 2569</em></h1>
 <div class="chips">
  <span class="c"><b style="background:#e23d4b">8</b>รถพยาบาล ศูนย์เอราวัณ</span>
  <span class="c"><b style="background:#6d4fd8">5</b>รถ ALS โรงพยาบาล</span>
  <span class="c"><b style="background:#f08a12">8</b>ทีม Motorlance</span>
  <span class="c"><b style="background:linear-gradient(120deg,#0ea5e9,#14b8a6)">2</b>HYDROLANCE</span>
 </div>
</div></div></body></html>
